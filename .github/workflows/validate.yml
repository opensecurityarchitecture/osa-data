name: Validate JSON Data

# skills/** is listed so that a change to a published skill rebuilds the
# website, which serves it. This file is listed so that a change to the
# workflow, such as a new version of an action, is run before it is merged.
on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.json'
      - 'scripts/validate_json.py'
      - 'skills/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/**/*.json'
      - 'scripts/validate_json.py'
      - 'skills/**'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --only-binary :all: jsonschema==4.23.0

      - name: Validate JSON syntax
        run: |
          python -c "
          import json
          from pathlib import Path
          errors = 0
          for p in Path('data').rglob('*.json'):
              try:
                  json.load(open(p))
              except:
                  print(f'Invalid JSON: {p}')
                  errors += 1
          exit(errors)
          "

      - name: Validate against schemas
        run: python scripts/validate_json.py

      - name: Check pattern manifest
        run: |
          python -c "
          import json
          manifest = json.load(open('data/patterns/_manifest.json'))
          print(f\"Patterns in manifest: {manifest['total_patterns']}\")
          from pathlib import Path
          actual = len([f for f in Path('data/patterns').glob('*.json') if not f.name.startswith('_')])
          print(f'Pattern files found: {actual}')
          assert manifest['total_patterns'] == actual, 'Manifest count mismatch'
          "

      - name: Check control manifest
        run: |
          python -c "
          import json
          manifest = json.load(open('data/controls/_manifest.json'))
          print(f\"Controls in manifest: {manifest['total_controls']}\")
          from pathlib import Path
          actual = len([f for f in Path('data/controls').glob('*.json') if not f.name.startswith('_')])
          print(f'Control files found: {actual}')
          assert manifest['total_controls'] == actual, 'Manifest count mismatch'
          "

      - name: Trigger website rebuild
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gh api repos/opensecurityarchitecture/osa-website/dispatches \
            -f event_type=data-updated
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
